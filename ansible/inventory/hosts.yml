# Inventaire STATIQUE de secours (lab netauto), même structure que NetBox.
# Usage : ansible-playbook -i inventory/hosts.yml deploy.yml
all:
  children:
    router:
      hosts:
        r1:
          ansible_host: 172.20.20.11
        r2:
          ansible_host: 172.20.20.12
    switch:
      hosts:
        sw1:
          ansible_host: 172.20.20.21
        sw2:
          ansible_host: 172.20.20.22
    container:
      hosts:
        client1:
          container_name: clab-netauto-client1
        client2:
          container_name: clab-netauto-client2
