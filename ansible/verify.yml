# Vérification après déploiement, sans aucune IP en dur :
# tout est lu dans l'inventaire (NetBox par défaut, ou inventory/hosts.yml).
# Usage : ansible-playbook verify.yml
#
# Convention : chaque client (groupe "container") a son interface de données "eth1".
# Le nom du conteneur Docker = nom de l'hôte, sauf si la variable container_name est définie.

- name: Vérifier les sessions BGP sur les routeurs
  hosts: router
  gather_facts: false
  tasks:
    # BGP met du temps à monter après un déploiement : on réessaie
    # toutes les 10 s pendant 2 min, puis on échoue si ce n'est pas établi.
    - name: Attendre que les sessions BGP soient établies
      nokia.srlinux.get:
        paths:
          - path: "/network-instance[name=default]/protocols/bgp/neighbor[peer-address={{ item.ip }}]/session-state"
            datastore: state
      loop: "{{ bgp_neighbors | default([]) }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item.ip }}"
      register: bgp
      until: bgp.result[0] == 'established'
      retries: 12
      delay: 10

- name: Connectivité de bout en bout entre tous les clients
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    clients: "{{ groups['container'] | default([]) }}"
  tasks:
    - name: Vérifier qu'il y a au moins deux clients à tester
      ansible.builtin.assert:
        that: clients | length >= 2
        fail_msg: "Moins de deux clients (groupe 'container') dans l'inventaire : aucun ping possible"
        quiet: true

    - name: Ping entre chaque paire de clients
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ hostvars[item.0].container_name | default(item.0) }}"
          - ping
          - -c
          - "3"
          - -W
          - "1"
          - "{{ (hostvars[item.1].interfaces | selectattr('name', 'equalto', 'eth1') | first).ip_addresses[0].address.split('/')[0] }}"
      loop: "{{ clients | product(clients) | list }}"
      loop_control:
        label: "{{ item.0 }} -> {{ item.1 }}"
      when: item.0 != item.1
      changed_when: false
