# Vérification rapide après déploiement.
# Usage : ansible-playbook verify.yml
# (La 3e personne pourra transformer ça en vrais tests pytest/Nornir.)
- name: Vérifier l'état BGP sur les routeurs
  hosts: router
  gather_facts: false
  tasks:
    # BGP met du temps à monter après un déploiement : on réessaie
    # toutes les 10 s pendant 2 min, puis on échoue si ce n'est pas établi.
    - name: Attendre que les sessions BGP soient établies
      nokia.srlinux.get:
        paths:
          - path: "/network-instance[name=default]/protocols/bgp/neighbor[peer-address={{ item.ip }}]/session-state"
            datastore: state
      loop: "{{ bgp_neighbors }}"
      loop_control:
        label: "{{ inventory_hostname }} -> {{ item.ip }}"
      register: bgp
      until: bgp.result[0] == 'established'
      retries: 12
      delay: 10

- name: Test de bout en bout
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ping client1 -> client2
      ansible.builtin.command: docker exec clab-netauto-client1 ping -c 3 -W 1 192.168.20.10
      changed_when: false

    - name: Ping client2 -> client1
      ansible.builtin.command: docker exec clab-netauto-client2 ping -c 3 -W 1 192.168.10.10
      changed_when: false
