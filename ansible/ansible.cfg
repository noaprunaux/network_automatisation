[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
# Le mot de passe du vault n'est PAS configuré ici :
# il est fourni par la variable d'environnement ANSIBLE_VAULT_PASSWORD_FILE
# (fichier local ~/.vault_pass sur la VM, variable "File" dans GitLab CI).
