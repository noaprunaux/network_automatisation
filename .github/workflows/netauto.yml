name: netauto

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: netauto-lab
  cancel-in-progress: false

# Inventaire Ansible = NetBox (ansible.cfg). Le token NetBox est lu dans le vault
# à chaque étape Ansible, puis masqué dans les logs.

jobs:
  check:
    runs-on: [self-hosted, netauto]
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint YAML et syntaxe Ansible
        run: |
          source /home/debian/venv/bin/activate
          yamllint -d relaxed ansible/*.yml ansible/inventory/
          cd ansible
          ansible-playbook --syntax-check -i inventory/hosts.yml render.yml deploy.yml verify.yml

      - name: Render et Diff (dry-run)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          cd ansible
          export NETBOX_TOKEN=$(ansible-vault view --vault-password-file "$VAULT_FILE" inventory/group_vars/all/vault.yml | awk '/vault_netbox_token/ {print $2}' | tr -d '"')
          echo "::add-mask::$NETBOX_TOKEN"
          ansible-playbook render.yml --vault-password-file "$VAULT_FILE"
          ansible-playbook deploy.yml --check --diff --vault-password-file "$VAULT_FILE"

  deploy:
    runs-on: [self-hosted, netauto]
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déployer la config (Ansible)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          cd ansible
          export NETBOX_TOKEN=$(ansible-vault view --vault-password-file "$VAULT_FILE" inventory/group_vars/all/vault.yml | awk '/vault_netbox_token/ {print $2}' | tr -d '"')
          echo "::add-mask::$NETBOX_TOKEN"
          ansible-playbook deploy.yml --diff --vault-password-file "$VAULT_FILE"

      - name: Vérifier BGP et ping (Ansible)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          cd ansible
          export NETBOX_TOKEN=$(ansible-vault view --vault-password-file "$VAULT_FILE" inventory/group_vars/all/vault.yml | awk '/vault_netbox_token/ {print $2}' | tr -d '"')
          echo "::add-mask::$NETBOX_TOKEN"
          ansible-playbook verify.yml --vault-password-file "$VAULT_FILE"

      - name: Valider l'état réel (Nornir)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          export ANSIBLE_VAULT_PASSWORD_FILE="$VAULT_FILE"
          cd nornir
          python validate.py

      - name: Sauvegarder les configs (Nornir)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          export ANSIBLE_VAULT_PASSWORD_FILE="$VAULT_FILE"
          cd nornir
          python backup.py

  drift:
    runs-on: [self-hosted, netauto]
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dérive d'état (Nornir)
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          export ANSIBLE_VAULT_PASSWORD_FILE="$VAULT_FILE"
          cd nornir
          python validate.py

      - name: Dérive de configuration (Ansible vs NetBox)
        if: always()
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          source /home/debian/venv/bin/activate
          VAULT_FILE=$(mktemp)
          trap "rm -f $VAULT_FILE" EXIT
          printf '%s' "$VAULT_PASS" > "$VAULT_FILE"
          cd ansible
          export NETBOX_TOKEN=$(ansible-vault view --vault-password-file "$VAULT_FILE" inventory/group_vars/all/vault.yml | awk '/vault_netbox_token/ {print $2}' | tr -d '"')
          echo "::add-mask::$NETBOX_TOKEN"
          ansible-playbook deploy.yml --check --diff --vault-password-file "$VAULT_FILE" | tee drift.log
          if grep -Eq "changed=[1-9]" drift.log; then
            echo "::error::Dérive de configuration : le réseau ne correspond plus à NetBox"
            exit 1
          fi
          echo "Aucune dérive de configuration"
