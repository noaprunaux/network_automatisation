srlinux:
  connection_options:
    # Netmiko : SSH + CLI
    netmiko:
      platform: nokia_srl
    # NAPALM : getters normalisés (driver communautaire napalm-srlinux, via JSON-RPC)
    napalm:
      platform: srlinux
      extras:
        optional_args:
          jsonrpc_port: 443
          insecure: false
          skip_verify: true    # certificat auto-signé du lab
