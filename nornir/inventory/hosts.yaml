# Inventaire Nornir. Les identifiants ne sont PAS ici :
# ils sont lus dans le vault Ansible au démarrage (voir common.py).
# À terme, cet inventaire peut venir de NetBox (plugin nornir_netbox).
r1:
  hostname: 172.20.20.11
  groups: [srlinux]
  data:
    role: router
r2:
  hostname: 172.20.20.12
  groups: [srlinux]
  data:
    role: router
sw1:
  hostname: 172.20.20.21
  groups: [srlinux]
  data:
    role: switch
sw2:
  hostname: 172.20.20.22
  groups: [srlinux]
  data:
    role: switch
